# =============================================================================
# GitLab CI/CD Pipeline - RAG Ultra Performant Multimodal API
# =============================================================================

# Configuration globale
image: docker:24.0.5

variables:
  # Docker
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  
  # Application
  APP_NAME: "rag-multimodal-api"
  APP_VERSION: "2005.0.1"
  
  # Registry GitLab
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE
  
  # Environnements
  DEV_HOST: "dev.rag-api.com"
  STAGING_HOST: "staging.rag-api.com"
  PROD_HOST: "rag-api.com"

# Services
services:
  - docker:24.0.5-dind

# Stages du pipeline
stages:
  - validate
  - test
  - build
  - security
  - deploy-dev
  - deploy-staging
  - deploy-production
  - cleanup

# =============================================================================
# STAGE: VALIDATION
# =============================================================================

# Validation du code et des configurations
validate:dockerfile:
  stage: validate
  script:
    - echo "🔍 Validation du Dockerfile..."
    - docker run --rm -i hadolint/hadolint < Dockerfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:docker-compose:
  stage: validate
  script:
    - echo "🔍 Validation des fichiers Docker Compose..."
    - docker-compose -f docker-compose.yml config
    - docker-compose -f docker-compose.dev.yml config
    - docker-compose -f docker-compose.prod.yml config
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:python:
  image: python:3.11-slim
  stage: validate
  before_script:
    - pip install --upgrade pip
    - pip install flake8 black isort mypy
  script:
    - echo "🔍 Validation du code Python..."
    - flake8 app/ --max-line-length=88 --extend-ignore=E203,W503
    - black --check app/
    - isort --check-only app/
    - mypy app/ --ignore-missing-imports
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# STAGE: TESTS
# =============================================================================

test:unit:
  image: python:3.11-slim
  stage: test
  services:
    - redis:7-alpine
    - chromadb/chroma:latest
  variables:
    REDIS_URL: "redis://redis:6379"
    CHROMA_HOST: "chromadb-chroma"
    CHROMA_PORT: "8000"
  before_script:
    - apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-asyncio
  script:
    - echo "🧪 Exécution des tests unitaires..."
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:integration:
  stage: test
  script:
    - echo "🔗 Tests d'intégration avec Docker Compose..."
    - docker-compose -f docker-compose.yml up -d
    - sleep 30
    - docker-compose exec -T rag-api curl -f http://localhost:8000/health
    - docker-compose exec -T rag-api python -m pytest tests_scripts/test_complete_system.py -v
  after_script:
    - docker-compose -f docker-compose.yml down -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# STAGE: BUILD
# =============================================================================

build:development:
  stage: build
  script:
    - echo "🏗️ Build de l'image de développement..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --target development -t $REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA .
    - docker build --target development -t $REGISTRY_IMAGE:dev-latest .
    - docker push $REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE:dev-latest
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

build:staging:
  stage: build
  script:
    - echo "🏗️ Build de l'image de staging..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --target production -t $REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA .
    - docker build --target production -t $REGISTRY_IMAGE:staging-latest .
    - docker push $REGISTRY_IMAGE:staging-$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_IMAGE:staging-latest
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

build:production:
  stage: build
  script:
    - echo "🏗️ Build de l'image de production..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --target production -t $REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker build --target production -t $REGISTRY_IMAGE:latest .
    - docker push $REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# STAGE: SÉCURITÉ
# =============================================================================

security:container-scan:
  stage: security
  script:
    - echo "🔒 Scan de sécurité des containers..."
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock 
      -v $PWD:/tmp/.cache/ aquasec/trivy:latest image 
      --exit-code 0 --no-progress --format table 
      $REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

security:secrets-scan:
  image: alpine:latest
  stage: security
  before_script:
    - apk add --no-cache git
    - git clone https://github.com/trufflesecurity/trufflehog.git
    - cd trufflehog && go build
  script:
    - echo "🔍 Scan des secrets..."
    - ./trufflehog/trufflehog filesystem . --json > secrets-report.json
  artifacts:
    reports:
      secret_detection: secrets-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# =============================================================================
# STAGE: DÉPLOIEMENT DÉVELOPPEMENT
# =============================================================================

deploy:development:
  stage: deploy-dev
  environment:
    name: development
    url: https://$DEV_HOST
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEV_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Déploiement en développement..."
    - ssh $DEV_USER@$DEV_HOST "
        cd /opt/rag-api &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        export REGISTRY_IMAGE=$REGISTRY_IMAGE &&
        export IMAGE_TAG=dev-$CI_COMMIT_SHORT_SHA &&
        docker-compose -f docker-compose.dev.yml pull &&
        docker-compose -f docker-compose.dev.yml up -d &&
        docker system prune -f
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# =============================================================================
# STAGE: DÉPLOIEMENT STAGING
# =============================================================================

deploy:staging:
  stage: deploy-staging
  environment:
    name: staging
    url: https://$STAGING_HOST
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Déploiement en staging..."
    - ssh $STAGING_USER@$STAGING_HOST "
        cd /opt/rag-api &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        export REGISTRY_IMAGE=$REGISTRY_IMAGE &&
        export IMAGE_TAG=staging-$CI_COMMIT_SHORT_SHA &&
        docker-compose -f docker-compose.yml pull &&
        docker-compose -f docker-compose.yml up -d &&
        docker system prune -f
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# =============================================================================
# STAGE: DÉPLOIEMENT PRODUCTION
# =============================================================================

deploy:production:
  stage: deploy-production
  environment:
    name: production
    url: https://$PROD_HOST
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Déploiement en production..."
    - ssh $PROD_USER@$PROD_HOST "
        cd /opt/rag-api &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        export REGISTRY_IMAGE=$REGISTRY_IMAGE &&
        export IMAGE_TAG=$CI_COMMIT_TAG &&
        ./deploy.sh install --environment=production --domain=$PROD_HOST &&
        docker system prune -f
      "
  when: manual
  rules:
    - if: $CI_COMMIT_TAG

# Rollback production
rollback:production:
  stage: deploy-production
  environment:
    name: production
    url: https://$PROD_HOST
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🔄 Rollback en production..."
    - ssh $PROD_USER@$PROD_HOST "
        cd /opt/rag-api &&
        ./deploy.sh rollback
      "
  when: manual
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# STAGE: NETTOYAGE
# =============================================================================

cleanup:registry:
  stage: cleanup
  script:
    - echo "🧹 Nettoyage des anciennes images..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Garder seulement les 10 dernières images
    - |
      for tag in $(docker images $REGISTRY_IMAGE --format "table {{.Tag}}" | tail -n +2 | head -n -10); do
        docker rmi $REGISTRY_IMAGE:$tag || true
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: delayed
      start_in: 1 hour

# =============================================================================
# JOBS UTILITAIRES
# =============================================================================

# Notification Slack/Teams (optionnel)
notify:success:
  stage: .post
  image: alpine:latest
  script:
    - echo "✅ Pipeline réussi pour $CI_COMMIT_REF_NAME"
    # Ajouter ici l'intégration Slack/Teams si nécessaire
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

notify:failure:
  stage: .post
  image: alpine:latest
  script:
    - echo "❌ Pipeline échoué pour $CI_COMMIT_REF_NAME"
    # Ajouter ici l'intégration Slack/Teams si nécessaire
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure